<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – BobHealth</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="page-center">
    <div class="card">
      <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:4px;color:var(--color-primary)">BobHealth</h1>
      <p style="color:var(--grey-500);font-size:.9rem;margin-bottom:24px">Multilingual doctor–patient consultation</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••" />
        </div>

        <div class="form-error" id="login-error" role="alert" aria-live="polite"></div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px" id="login-btn">Sign in</button>
      </form>

      <p style="margin-top:16px;font-size:.875rem;text-align:center;color:var(--grey-500)">
        Don't have an account? <a href="/register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="/js/languages.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/prefs.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
