<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – BobHealth</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <span class="topbar-brand">BobHealth</span>
    <div class="topbar-user">
      <span id="topbar-name"></span>
      <span class="badge" id="topbar-role"></span>
      <span class="badge badge-lang" id="topbar-lang"></span>
      <button class="btn btn-secondary" id="logout-btn" style="padding:6px 12px;font-size:.8rem">Sign out</button>
    </div>
  </header>

  <main class="container" style="padding-top:28px;padding-bottom:60px">

    <!-- ── Doctor section ──────────────────────────────────────────── -->
    <section id="doctor-section" hidden>
      <div class="card">
        <h2 class="section-title">Start a consultation</h2>
        <button class="btn btn-primary" id="start-consult-btn">+ New consultation</button>

        <div id="new-consult-result" hidden style="margin-top:20px;text-align:center">
          <p style="color:var(--grey-500);font-size:.875rem;margin-bottom:4px">Share this code with your patient:</p>
          <div class="code-display" id="consult-code"></div>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
            <button class="btn btn-secondary" id="copy-code-btn">Copy code</button>
            <a id="open-consult-link" class="btn btn-primary" href="#">Open consultation</a>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Patient section ─────────────────────────────────────────── -->
    <section id="patient-section" hidden>
      <div class="card">
        <h2 class="section-title">Join a consultation</h2>
        <form id="join-form" novalidate style="display:flex;gap:10px;align-items:flex-end">
          <div class="form-group" style="flex:1;margin-bottom:0">
            <label for="join-code">Consultation code</label>
            <input type="text" id="join-code" maxlength="6" placeholder="ABCDEF"
                   style="text-transform:uppercase;letter-spacing:.15em;font-weight:700" />
          </div>
          <button type="submit" class="btn btn-primary">Join</button>
        </form>
        <div class="form-error" id="join-error" role="alert" aria-live="polite" style="margin-top:8px"></div>
      </div>
    </section>

    <!-- ── Consultations list ──────────────────────────────────────── -->
    <div class="card">
      <h2 class="section-title">My consultations</h2>
      <div id="consult-list-wrap">
        <p style="color:var(--grey-400);font-size:.875rem" id="consult-empty">No consultations yet.</p>
        <div style="overflow-x:auto" id="consult-table-wrap" hidden>
          <table class="consult-table" id="consult-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Other person</th>
                <th>Status</th>
                <th>Messages</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="consult-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── Preferences card ────────────────────────────────────────── -->
    <div class="card">
      <h2 class="section-title">My language &amp; preferences</h2>

      <div class="form-group">
        <label for="pref-language">My language</label>
        <select id="pref-language"></select>
        <span class="form-hint" id="pref-lang-source"></span>
      </div>

      <div class="form-group">
        <label>Speak in (default)</label>
        <div class="segmented" id="speak-in-toggle" role="group"></div>
      </div>

      <div class="form-group">
        <label>Listen in (default)</label>
        <div class="segmented" id="listen-in-toggle" role="group">
          <button type="button" data-val="original">Original</button>
          <button type="button" data-val="native">My language</button>
          <button type="button" data-val="english">English</button>
        </div>
      </div>

      <div class="form-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="pref-autoplay" style="width:auto" />
        <label for="pref-autoplay" style="font-weight:400;cursor:pointer">Auto-play incoming audio</label>
      </div>

      <div class="form-error" id="prefs-error" role="alert" aria-live="polite"></div>
      <button class="btn btn-primary" id="save-prefs-btn" style="margin-top:4px">Save preferences</button>
      <span id="prefs-saved" style="margin-left:12px;font-size:.85rem;color:var(--color-primary);display:none">✓ Saved</span>
    </div>

    <!-- ── Provider settings card ──────────────────────────────────── -->
    <div class="card">
      <h2 class="section-title">Speech &amp; translation providers</h2>
      <div id="providers-wrap">
        <p style="color:var(--grey-400);font-size:.875rem">Loading…</p>
      </div>
      <div id="providers-actions" hidden>
        <div class="form-error" id="providers-error" role="alert" aria-live="polite"></div>
        <button class="btn btn-primary" id="save-providers-btn" style="margin-top:8px">Save provider settings</button>
        <span id="providers-saved" style="margin-left:12px;font-size:.85rem;color:var(--color-primary);display:none">✓ Saved</span>
      </div>
    </div>

  </main>

  <script src="/js/languages.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/prefs.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
