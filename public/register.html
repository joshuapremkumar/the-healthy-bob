<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – BobHealth</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="page-center">
    <div class="card">
      <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:4px;color:var(--color-primary)">BobHealth</h1>
      <p style="color:var(--grey-500);font-size:.9rem;margin-bottom:24px">Create your account</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required placeholder="Dr. Priya Sharma" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password <span style="font-weight:400;color:var(--grey-400)">(min 6 characters)</span></label>
          <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="••••••" />
        </div>

        <div class="form-group">
          <label>I am a</label>
          <div class="segmented" id="role-toggle" role="group" aria-label="Role">
            <button type="button" id="role-patient" data-role="patient">Patient</button>
            <button type="button" id="role-doctor"  data-role="doctor">Doctor</button>
          </div>
          <div class="form-error" id="role-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="language">My language</label>
          <select id="language" name="language" required></select>
          <span class="form-hint" id="lang-hint">Detected from your browser – change if needed</span>
        </div>

        <div class="form-error" id="register-error" role="alert" aria-live="polite"></div>

        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px" id="register-btn">Create account</button>
      </form>

      <p style="margin-top:16px;font-size:.875rem;text-align:center;color:var(--grey-500)">
        Already have an account? <a href="/login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/languages.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/prefs.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
